config_paths:
  - resources_servers/facts_grounding_v2/configs/facts_grounding_v2.yaml

facts_grounding_v2_public:
  _inherit_from: facts_grounding_v2_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
        - name: facts_grounding_v2
          type: benchmark
          jsonl_fpath: benchmarks/facts_grounding_v2/data/facts_grounding_v2_public.jsonl
          prepare_script: benchmarks/facts_grounding_v2/prepare.py
          # Rows carry `full_prompt` as the single user message, exactly as the official starter prompts the
          # evaluated model; no prompt template is applied.
          prompt_config: null
          num_repeats: 1
          license: Apache 2.0

# Compatibility bridge for current Gym rollout dispatch. The benchmark branch
# predates explicit environment-server declarations, while the simple agent
# owns verification through the FACTS Grounding v2 resources server.
facts_grounding_v2_public_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: facts_grounding_v2_public
