config_paths:
  - benchmarks/xstest/config.yaml

allenai_wildguard_model_server:
  responses_api_models:
    _delete_key: local_vllm_model
    openai_model:
      entrypoint: app.py
      openai_base_url: https://api.portkey.ai/v1
      openai_api_key: ${oc.env:PORTKEY_API_KEY}
      openai_model: "@openai/gpt-4.1"

xstest_resources_server:
  resources_servers:
    xstest:
      judge_prompt_template_fpath: prompt_templates/xstest_judge.txt
      judge_output_format: xstest
      judge_endpoint_max_concurrency: 32
      judge_responses_create_params:
        input: []
        max_output_tokens: 64
        temperature: 0.0
