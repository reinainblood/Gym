config_paths:
  - responses_api_agents/agentdyn_agent/configs/agentdyn_agent.yaml

agentdyn_benchmark:
  _inherit_from: agentdyn_agent
  responses_api_agents:
    agentdyn_agent:
      # Abandon a rollout that will not finish. CaMeL interprets model-generated Python with
      # no step or time budget of its own, and because the agent serializes rollouts a program
      # that does not terminate stops the cell for the rest of the campaign rather than
      # costing one row -- measured locally at 32 minutes on one core with the cell frozen at
      # 6/620. It belongs here rather than only in the local runner's generated config, so
      # that every way of launching this benchmark inherits it, containers included.
      #
      # 1200s was calibrated against serialized rollouts. Running several at once makes each
      # one slower in wall-clock without making any of them hung, so the old bound started
      # firing on healthy work: four of eight CaMeL shards abandoned two rollouts each,
      # tripped `max_abandoned_rollouts`, and the agent exited as designed -- but the
      # container outlives the stack and keeps publishing a heartbeat, so the launcher's
      # liveness check read the corpse as live and never relaunched it. The bound has to
      # leave room for contention or it converts a slow rollout into a dead cell.
      rollout_timeout_seconds: 3600
      datasets:
        - name: agentdyn
          type: benchmark
          jsonl_fpath: benchmarks/agentdyn/data/agentdyn_v1_2_2.jsonl
          prepare_script: benchmarks/agentdyn/prepare.py
          prompt_config: null
          num_repeats: 1
          license: MIT
