# KORA (https://korabench.ai): child-safety conversations between a simulated child and the
# model under test, graded failing / adequate / exemplary by the published judge.
#
# One resources server (the judge), one agent (the child simulator loop) and two auxiliary
# model servers: the child and the judge. Neither may be the policy. Datasets are
# materialized by `python -m benchmarks.kora.prepare`, which fetches the run package from
# korabench.ai; only the five example rows are committed.
#
# The harness profile the leaderboard was produced with (profiles/kora.json upstream):
#   child  deepseek/deepseek-v3.2, temperature 1.3, 300 output tokens per message
#   judge  openai/gpt-5.2, reasoning effort medium, 26,000 output tokens, one judge

kora_resources_server:
  resources_servers:
    kora:
      entrypoint: app.py
      domain: safety
      verified: false
      description: KORA child-safety benchmark; multi-turn conversations with a simulated child across 26 risks and 3 age bands, graded failing/adequate/exemplary plus 7 behaviours by an LLM judge
      value: Measure whether a model keeps a child safe over a conversation, not just on a first reply, and which behaviours (sycophancy, anthropomorphism, missed redirection, ...) drive failures

      judge_model_server:
        type: responses_api_models
        name: kora_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 26000
      judge_name: gpt-5.2-medium
      # Upstream asks the judge for its verdict as a strict JSON schema through the AI SDK;
      # this sends the same schema via the Responses API `text.format`.
      judge_structured_output: true

# --- The conversation loop ------------------------------------------------------------
# The agent plays the child. Turn one is the scenario's stored opening message; every
# later child turn comes from the child model, conditioned on the narrative and the
# transcript so far. The model under test only ever sees its system prompt and the
# child's messages.
kora_child_actor_agent:
  responses_api_agents:
    kora_child_actor:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: kora_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      child_model_server:
        type: responses_api_models
        name: kora_child_model
      child_responses_create_params:
        input: []
        temperature: 1.3
        max_output_tokens: 300
      datasets:
      - name: kora
        type: validation
        jsonl_fpath: resources_servers/kora/data/kora.jsonl
        num_repeats: 1
        # `TBD` is Gym's own entry for a dataset whose terms match no named licence, which
        # is this one: KORA publishes the package under its Permitted Use & Terms of Service
        # (https://korabench.ai/terms): research, internal evaluation and benchmarking, with
        # attribution. The terms are summarized in benchmarks/kora/README.md.
        license: TBD
      - name: example
        type: example
        jsonl_fpath: resources_servers/kora/data/example.jsonl
        num_repeats: 1

# --- Judge and child model servers ----------------------------------------------------
# Declared here so the config resolves on its own; endpoints and keys are supplied per
# deployment (see benchmarks/kora/configs/env.yaml.example). A user env.yaml that defines
# these instances in full takes precedence.
kora_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${kora_judge_base_url}
      openai_api_key: ${kora_judge_api_key}
      openai_model: ${kora_judge_model_name}
      extra_body:
        reasoning:
          effort: medium

# The child is served through the chat-completions adapter: DeepSeek's API (and most
# OpenAI-compatible providers) has no Responses endpoint, which openai_model requires.
kora_child_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${kora_child_base_url}
      api_key: ${kora_child_api_key}
      model: ${kora_child_model_name}
      uses_reasoning_parser: false

# Defaults so OmegaConf resolves the interpolations without overrides. Model names default
# to the published profile; endpoints and keys have no sensible default and stay null
# until supplied. Must stay at end of file for update_env_list.py.
kora_judge_base_url: null
kora_judge_api_key: null
kora_judge_model_name: gpt-5.2
kora_child_base_url: null
kora_child_api_key: null
kora_child_model_name: deepseek/deepseek-v3.2
