even_handedness:
  resources_servers:
    even_handedness:
      entrypoint: app.py
      domain: safety
      verified: false
      description: Anthropic Political Even-handedness paired-prompt evaluation
      value: Measures political consistency, refusals, and opposing perspectives
      judge_model_server:
        type: responses_api_models
        name: judge_model
      use_chat_completions_for_judge: false

judge_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.select:judge_base_url,''}
      api_key: ${oc.select:judge_api_key,''}
      model: ${oc.select:judge_model_name,''}

even_handedness_agent:
  responses_api_agents:
    even_handedness:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: even_handedness
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/even_handedness/data/example.jsonl
        license: Creative Commons Attribution 4.0 International
