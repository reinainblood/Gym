facts_parametric:
  resources_servers:
    facts_parametric:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: FACTS Parametric factual recall with a three-sample semantic LLM judge
      value: Evaluate factual recall, abstention, and grader uncertainty
      judge_model_server:
        type: responses_api_models
        name: judge_model
      use_chat_completions_for_judge: true
      judge_samples: 3

judge_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${judge_base_url}
      api_key: ${judge_api_key}
      model: ${judge_model_name}

facts_parametric_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: facts_parametric
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/facts_parametric/data/example.jsonl
        license: TBD
