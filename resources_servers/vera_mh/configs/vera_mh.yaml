vera_mh:
  resources_servers:
    vera_mh:
      entrypoint: app.py
      domain: safety
      verified: false
      description: VERA-MH simulated mental-health crisis conversations judged with the clinical v1.2 rubric by GPT 5.4
      value: Measure suicide-risk detection, risk confirmation, guidance to human care, supportive conversation, and AI boundaries in multi-turn chats
      judge_model_server:
        type: responses_api_models
        name: vera_mh_judge
      # Recommended judge profile (README "Recommended settings", CHANGELOG v1.2.0): GPT 5.4, reasoning_effort=low.
      # Upstream's temperature=0 default is dropped for gpt-5+ reasoning models, so it stays unset here.
      judge_reasoning_effort: low
      judge_temperature: null
      # Raised from upstream's 3. The judge answers a small share of (transcript, question)
      # slots in prose ("ANSWER: No\nREASONING: ...") instead of the requested JSON, and
      # those slots are sticky: the first-attempt prose rate is 2.0%, but once a slot has
      # failed once it fails again ~35% of the time. Retries are independent (73 of 73
      # multi-attempt slots returned different text each time), so more attempts do clear
      # them. At 3 retries ~3 conversations per model exhausted the budget, and because one
      # unparseable question aborts the whole conversation, a formatting flake was
      # discarding entire 30-turn transcripts. This changes no verdict: it only asks again.
      judge_parse_retries: 8

# Official judge and user simulators reached through any OpenAI-compatible Chat Completions endpoint; endpoint
# details stay out of the repo. Model ids default to the upstream recommended profile.
vera_mh_judge:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:VERA_MH_JUDGE_BASE_URL,''}
      api_key: ${oc.env:VERA_MH_JUDGE_API_KEY,''}
      model: ${oc.env:VERA_MH_JUDGE_MODEL,gpt-5.4}
      num_concurrent_requests: ${oc.decode:${oc.env:VERA_MH_JUDGE_CONCURRENCY,8}}

vera_mh_user_gpt52:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:VERA_MH_USER_GPT52_BASE_URL,''}
      api_key: ${oc.env:VERA_MH_USER_GPT52_API_KEY,''}
      model: ${oc.env:VERA_MH_USER_GPT52_MODEL,gpt-5.2}
      num_concurrent_requests: ${oc.decode:${oc.env:VERA_MH_USER_CONCURRENCY,8}}

vera_mh_user_opus45:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:VERA_MH_USER_OPUS45_BASE_URL,''}
      api_key: ${oc.env:VERA_MH_USER_OPUS45_API_KEY,''}
      model: ${oc.env:VERA_MH_USER_OPUS45_MODEL,claude-opus-4-5-20251101}
      num_concurrent_requests: ${oc.decode:${oc.env:VERA_MH_USER_CONCURRENCY,8}}

vera_mh_agent:
  responses_api_agents:
    vera_mh_agent:
      entrypoint: app.py
      domain: safety
      description: VERA-MH persona-vs-provider conversation simulation with separately named simulator and provider model servers
      value: Evaluate chatbot safety in simulated suicide-risk conversations before judging with the clinical rubric
      resources_server:
        type: resources_servers
        name: vera_mh
      # The provider under evaluation.
      model_server:
        type: responses_api_models
        name: policy_model
      # Recommended profile: GPT 5.2 and Claude Opus 4.5 user agents (README "Recommended settings").
      user_model_servers:
        gpt-5.2:
          type: responses_api_models
          name: vera_mh_user_gpt52
        claude-opus-4-5:
          type: responses_api_models
          name: vera_mh_user_opus45
      # Upstream passes no sampling overrides to the user agents; LangChain's ChatAnthropic client caps Claude
      # replies at 1024 tokens by default, which is reproduced here. Persona replies are 1-4 sentences.
      user_responses_create_params:
        claude-opus-4-5:
          input: []
          max_output_tokens: 1024
      max_turns: 30
      persona_speaks_first: true
      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/vera_mh_agent/data/example.jsonl
